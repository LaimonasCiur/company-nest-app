version: '3.8'

services:
  nestjs-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: development
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USERNAME: sa
      DB_PASSWORD: YourStrong@Passw0rd
      DB_DATABASE: CompanyDB
      DB_SYNCHRONIZE: true
      DB_LOGGING: true
      API_PREFIX: api/v1
      SWAGGER_ENABLED: true
    ports:
      - "3000:3000"
    networks:
      - company-network
    depends_on:
      - sqlserver
    stdin_open: true
    tty: true
    command: sh -c "npm install && npm run start:dev"